name: web

on:
  # By hand too, so the checks can be run on a commit that was pushed while Actions was off.
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "apps/site/**"
      - "packages/**"
      - "bun.lock"
      - ".github/workflows/web.yml"
  pull_request:
    paths:
      - "apps/web/**"
      - "apps/site/**"
      - "packages/**"
      - "bun.lock"
      - ".github/workflows/web.yml"

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run --filter @dipper/web typecheck
      - run: bun test packages
      - run: bun run --filter @dipper/web build
