name: server

on:
  # By hand too, so the checks can be run on a commit that was pushed while Actions was off.
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/server/**"
      - "packages/**"
      - ".github/workflows/server.yml"
  pull_request:
    paths:
      - "apps/server/**"
      - "packages/**"
      - ".github/workflows/server.yml"

env:
  GO_VERSION: "1.25"

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: apps/server/go.sum
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

  cli:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: apps/server
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: apps/server/go.sum
      # No UI is built here: the binary serves the API and says the UI is missing, which is the
      # behaviour this job is checking does not crash.
      - run: bash scripts/build.sh
      - run: ./dist/dipper --version && ./dist/dipper status
        env:
          DIPPER_HOME: ${{ runner.temp }}/dipper-home

  # Every release target builds from one machine, because CGO is off and every dependency is
  # pure Go. This is the job that would fail if that ever stopped being true.
  cross-compile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: apps/server/go.sum
      - run: bash scripts/build.sh --all

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dipper
          POSTGRES_PASSWORD: dipper
          POSTGRES_DB: dipper
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dipper" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DIPPER_SMOKE_PG: postgres://dipper:dipper@localhost:5432/dipper
    defaults:
      run:
        working-directory: apps/server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: apps/server/go.sum
      # smoke.sh asserts its JSON answers with `node -e`.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bash scripts/build.sh
      - run: psql "$DIPPER_SMOKE_PG" -f scripts/smoke-fixtures.sql
      - run: bash scripts/smoke.sh
