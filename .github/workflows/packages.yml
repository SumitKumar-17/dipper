name: packages

on:
  push:
    branches: [main]
    paths:
      - "packages/**"
      - "bun.lock"
      - ".github/workflows/packages.yml"
  pull_request:
    paths:
      - "packages/**"
      - "bun.lock"
      - ".github/workflows/packages.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run --filter @dipper/protocol typecheck
      - run: bun run --filter @dipper/client typecheck
      - run: bun run --filter @dipper/sql typecheck
      - run: bun run --filter @dipper/ui typecheck
      - run: bun run --filter @dipper/protocol check
