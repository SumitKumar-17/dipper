name: packages

on:
  # By hand too, so the checks can be run on a commit that was pushed while Actions was off.
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "packages/**"
      - "apps/server/protocol/**"
      - "bun.lock"
      - ".github/workflows/packages.yml"
  pull_request:
    paths:
      - "packages/**"
      - "apps/server/protocol/**"
      - "bun.lock"
      - ".github/workflows/packages.yml"

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run --filter @dipper/protocol typecheck
      - run: bun run --filter @dipper/client typecheck
      - run: bun run --filter @dipper/sql typecheck
      - run: bun run --filter @dipper/ui typecheck
      - run: bun run --filter @dipper/protocol check
